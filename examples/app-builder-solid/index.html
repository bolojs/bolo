<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bolo app builder (Solid)</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-flash theme bootstrap (ported from React app-builder). Mirrors the
      // same `bolo-app-builder:` keys so users switching between demos keep
      // their preference; only the host package changes.
      (function () {
        try {
          var stored = localStorage.getItem("bolo-app-builder:theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
