<!doctype html>
<meta charset="utf-8" />
<title>spike a</title>
<script>
  // Registers /a/sw.js, waits until this page is controlled, then spawns a
  // module worker and a classic worker. When both report back, fetches the
  // SW's request log and publishes window.__spikeResult.
  (async () => {
    const result = {
      controlled: false,
      moduleWorker: null,
      classicWorker: null,
      swLog: [],
      error: null,
    };
    try {
      if (!new URLSearchParams(location.search).has("nosw")) {
        const reg = await navigator.serviceWorker.register("/a/sw.js", { scope: "/a/" });
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          // clients.claim() should have fired controllerchange; give it a beat.
          await new Promise((r) => {
            navigator.serviceWorker.addEventListener("controllerchange", r, { once: true });
            setTimeout(r, 2000);
          });
        }
        if (!navigator.serviceWorker.controller && !sessionStorage.getItem("reloaded")) {
          sessionStorage.setItem("reloaded", "1");
          location.reload();
          return;
        }
        result.controlled = !!navigator.serviceWorker.controller;
      }

      const runWorker = (url, opts, timeoutMs) =>
        new Promise((resolve) => {
          let w;
          try {
            w = new Worker(url, opts);
          } catch (e) {
            return resolve({ status: "constructor-threw", error: String(e) });
          }
          const seen = [];
          const to = setTimeout(() => {
            w.terminate();
            resolve({ status: "timeout", seen });
          }, timeoutMs);
          w.onmessage = (e) => {
            if (e.data && e.data.done) {
              clearTimeout(to);
              w.terminate();
              resolve({ status: "done", seen, report: e.data.done });
            } else if (e.data && e.data.progress) {
              seen.push(e.data.progress);
            } else {
              seen.push(JSON.stringify(e.data));
            }
          };
          w.onerror = (e) => {
            clearTimeout(to);
            w.terminate();
            resolve({ status: "error", error: e.message || String(e) });
          };
        });

      result.moduleWorker = await runWorker("/a/worker.mjs?w=module", { type: "module" }, 8000);
      result.classicWorker = await runWorker("/a/worker-classic.js?w=classic", {}, 8000);

      // Give the SW a moment to flush its client-type lookups, then fetch the log.
      await new Promise((r) => setTimeout(r, 400));
      result.swLog = await (await fetch("/a/__swlog")).json();
      result.netLog = (await (await fetch("/__netlog")).json()).filter((n) =>
        n.url.includes("w="),
      );
    } catch (e) {
      result.error = String(e && e.stack ? e.stack : e);
    }
    window.__spikeResult = result;
  })();
</script>
